name: pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Executar testes (unit + integração) e gerar cobertura
        run: mvn verify
      - name: Gerar badge de cobertura JaCoCo
        id: jacoco
        uses: cicirello/jacoco-badge-generator@d1bf1a14cc2a171191fb3dc5d48cd1a9f4210008 # v2.0.1
      - name: Exibir cobertura
        run: echo "cobertura = ${{ steps.jacoco.outputs.coverage }}"
      - name: Upload do relatório JaCoCo
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7
          overwrite: true

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Gate de cobertura (jacoco check >= 80%) roda no verify.
      - name: Verificar qualidade (JaCoCo gate + Sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            mvn verify sonar:sonar -Dsonar.token="${SONAR_TOKEN}"
          else
            echo "::warning::SONAR_TOKEN ausente — rodando apenas o gate de cobertura."
            mvn verify
          fi

  build:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Empacotar aplicação
        run: mvn package -DskipTests

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Montar tag da imagem
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          HASH=$(git rev-parse --short HEAD)
          echo "image=${DOCKER_USERNAME}/os-service:v${VERSION}-${HASH}" >> "$GITHUB_OUTPUT"
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login no Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/os-service:latest
            ${{ steps.meta.outputs.image }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-service:buildcache,mode=max

  deploy-aws:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: vars.USE_AWS == 'true' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref_name }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      CLUSTER_NAME: workbench-platform-${{ github.ref_name }}
      IMAGE: ${{ needs.docker-build-push.outputs.image }}
      # Opcional: sem DD_API_KEY, o install do Datadog Agent é ignorado e a app
      # sobe sem observabilidade in-cluster (o rollout não é bloqueado).
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      # Valores reais do Secret da app, vindos dos secrets da org (o k8s/secret.yaml
      # só tem placeholders). DB_URL_* segue a branch (main/develop).
      DB_URL_OS: ${{ github.ref_name == 'main' && secrets.DB_URL_OS_MAIN || secrets.DB_URL_OS_DEVELOP }}
      DB_USERNAME_OS: ${{ secrets.DB_USERNAME_OS || 'os_service' }}
      DB_PASSWORD_OS: ${{ secrets.DB_PASSWORD_OS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validar secrets obrigatórios
        run: |
          missing=0
          for v in DB_URL_OS DB_USERNAME_OS DB_PASSWORD_OS JWT_SECRET; do
            if [ -z "${!v}" ]; then
              case "${v}" in
                DB_URL_*) src="${v}_MAIN / ${v}_DEVELOP" ;;
                *)        src="${v}" ;;
              esac
              echo "::error::Secret obrigatório vazio ou ausente: ${src} (secrets da org). Sem ele o Secret os-service-secret subiria sem credencial."
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"

      # Datadog Agent (DaemonSet) + Cluster Agent antes da app, para que o
      # admission controller injete o dd-java-agent no rollout. Sem DD_API_KEY o
      # passo é ignorado e a app sobe sem observabilidade in-cluster.
      - name: Configurar Helm
        if: ${{ env.DD_API_KEY != '' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Instalar Datadog Agent (Helm)
        if: ${{ env.DD_API_KEY != '' }}
        # Best-effort: observabilidade não deve bloquear o rollout da app.
        continue-on-error: true
        run: |
          kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic datadog-secret \
            --namespace datadog \
            --from-literal api-key="${DD_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm repo add datadog https://helm.datadoghq.com
          helm repo update
          helm upgrade --install datadog datadog/datadog \
            --namespace datadog \
            -f k8s/datadog/values.yaml \
            --set datadog.clusterName="${CLUSTER_NAME}"

      - name: Aplicar manifests
        run: |
          # DD_ENV precisa casar com os valores de env do dashboard/monitores
          # (developer/homolog/production). main->production, develop->homolog.
          case "${{ github.ref_name }}" in
            main)    DD_ENV_TAG="production" ;;
            develop) DD_ENV_TAG="homolog" ;;
            *)       DD_ENV_TAG="developer" ;;
          esac
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          # Secret com os valores reais (no lugar do k8s/secret.yaml, que só tem
          # placeholders). Vem depois do ConfigMap no envFrom, então as chaves daqui
          # prevalecem sobre as do ConfigMap.
          kubectl create secret generic os-service-secret -n os-service \
            --from-literal SPRING_DATASOURCE_URL="${DB_URL_OS}" \
            --from-literal SPRING_DATASOURCE_USERNAME="${DB_USERNAME_OS}" \
            --from-literal SPRING_DATASOURCE_PASSWORD="${DB_PASSWORD_OS}" \
            --from-literal JWT_SECRET="${JWT_SECRET}" \
            --from-literal DD_API_KEY="${DD_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/app.yaml
          kubectl apply -f k8s/hpa.yaml
          # A tag env das métricas kubernetes.* vem da label tags.datadoghq.com/env
          # do pod (não do DD_ENV do container). Sem ela o widget de CPU/memória
          # (env:$env) fica vazio. Injeta a mesma env mapeada acima.
          kubectl patch deployment os-service -n os-service --type merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"tags.datadoghq.com/env\":\"${DD_ENV_TAG}\"}}}}}"
      - name: Atualizar imagem do Deployment
        run: |
          kubectl set image deployment/os-service os-service="${IMAGE}" -n os-service
          kubectl rollout status deployment/os-service -n os-service --timeout=300s

  # ---------------------------------------------------------------------------
  # Datadog config — cria/atualiza o dashboard e os monitores versionados em
  # datadog/ via API (idempotente por título/nome). Independe do cluster: aplica
  # objetos no Datadog SaaS. Roda em develop/main; ignorado sem DD_API_KEY/DD_APP_KEY.
  # ---------------------------------------------------------------------------
  datadog-config:
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar credenciais Datadog
        id: guard
        run: |
          if [ -z "${DD_API_KEY}" ] || [ -z "${DD_APP_KEY}" ]; then
            echo "::warning::DD_API_KEY/DD_APP_KEY ausentes — pulando aplicação de dashboards/monitores."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Aplicar dashboard e monitores (upsert)
        if: steps.guard.outputs.skip != 'true'
        run: bash .github/scripts/apply-datadog.sh
