name: pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Conferir cópia do contrato da Saga (fonte única no workbench-messaging)
        run: |
          url=https://raw.githubusercontent.com/TechChalleng-FIAP-SOAT/workbench-messaging/main/contracts/saga-messages.json
          if ! curl --proto "=https" --tlsv1.2 -fsSL "$url" -o /tmp/saga-messages.json; then
            echo "::warning::Contrato canônico ainda não publicado na main do workbench-messaging — check pulado."
            exit 0
          fi
          if ! diff -u /tmp/saga-messages.json src/test/resources/contracts/saga-messages.json; then
            echo "::error::src/test/resources/contracts/saga-messages.json difere do contrato do workbench-messaging. Rode scripts/sync-saga-contract.sh lá e commite a cópia."
            exit 1
          fi
      - name: Executar testes (unit + integração) e gerar cobertura
        run: mvn verify
      - name: Gerar badge de cobertura JaCoCo
        id: jacoco
        uses: cicirello/jacoco-badge-generator@d1bf1a14cc2a171191fb3dc5d48cd1a9f4210008 # v2.0.1
      - name: Exibir cobertura
        run: echo "cobertura = ${{ steps.jacoco.outputs.coverage }}"
      - name: Upload do relatório JaCoCo
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7
          overwrite: true

  code-analysis:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Gate de cobertura (jacoco check >= 80%) roda no verify.
      - name: Verificar qualidade (JaCoCo gate + Sonar)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            mvn verify sonar:sonar -Dsonar.token="${SONAR_TOKEN}"
          else
            echo "::warning::SONAR_TOKEN ausente — rodando apenas o gate de cobertura."
            mvn verify
          fi

  build:
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Empacotar aplicação
        run: mvn package -DskipTests

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    outputs:
      # Só a tag: o GitHub descarta ("Skip output ... may contain secret") qualquer output de job
      # que contenha o DOCKER_USERNAME, e o deploy recebia a imagem vazia.
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Montar tag da imagem
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          HASH=$(git rev-parse --short HEAD)
          echo "image=${DOCKER_USERNAME}/os-service:v${VERSION}-${HASH}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-${HASH}" >> "$GITHUB_OUTPUT"
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login no Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/os-service:buildcache,mode=max

  deploy-aws:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: vars.USE_AWS == 'true' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref_name }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      CLUSTER_NAME: workbench-platform-${{ github.ref_name }}
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/os-service:${{ needs.docker-build-push.outputs.tag }}
      # Opcional: sem DD_API_KEY, o install do Datadog Agent é ignorado e a app
      # sobe sem observabilidade in-cluster (o rollout não é bloqueado).
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      # Valores reais do Secret da app, vindos dos secrets da org (o k8s/secret.yaml
      # só tem placeholders). DB_URL_* segue a branch (main/develop).
      DB_URL_OS: ${{ github.ref_name == 'main' && secrets.DB_URL_OS_MAIN || secrets.DB_URL_OS_DEVELOP }}
      DB_USERNAME_OS: ${{ secrets.DB_USERNAME_OS || 'os_service' }}
      DB_PASSWORD_OS: ${{ secrets.DB_PASSWORD_OS }}
      # JWT RS256: só a chave PÚBLICA (o serviço verifica, não emite token).
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
      # Chave privada do token de serviço que o os-service usa ao chamar o customer.
      JWT_SERVICE_PRIVATE_KEY: ${{ secrets.JWT_SERVICE_PRIVATE_KEY }}
      # Opcional: remetente verificado no SES. Com ele, o e-mail ao cliente sai pelo SES, direto
      # ao endereço do cliente. Sem ele, segue pelo tópico SNS (o e-mail vai para o inscrito).
      SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validar secrets obrigatórios
        run: |
          missing=0
          for v in DB_URL_OS DB_USERNAME_OS DB_PASSWORD_OS JWT_PUBLIC_KEY JWT_SERVICE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              case "${v}" in
                DB_URL_*) src="${v}_MAIN / ${v}_DEVELOP" ;;
                *)        src="${v}" ;;
              esac
              echo "::error::Secret obrigatório vazio ou ausente: ${src} (secrets da org). Sem ele o Secret os-service-secret subiria sem credencial."
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ github.ref_name == 'main' && secrets.AWS_ACCESS_KEY_ID_MAIN || secrets.AWS_ACCESS_KEY_ID_DEVELOP }}
          aws-secret-access-key: ${{ github.ref_name == 'main' && secrets.AWS_SECRET_ACCESS_KEY_MAIN || secrets.AWS_SECRET_ACCESS_KEY_DEVELOP }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"

      # Datadog Agent (DaemonSet) + Cluster Agent antes da app, para que o
      # admission controller injete o dd-java-agent no rollout. Sem DD_API_KEY o
      # passo é ignorado e a app sobe sem observabilidade in-cluster.
      - name: Configurar Helm
        if: ${{ env.DD_API_KEY != '' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Instalar Datadog Agent (Helm)
        if: ${{ env.DD_API_KEY != '' }}
        # Best-effort: observabilidade não deve bloquear o rollout da app.
        continue-on-error: true
        run: |
          kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic datadog-secret \
            --namespace datadog \
            --from-literal api-key="${DD_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm repo add datadog https://helm.datadoghq.com
          helm repo update
          helm upgrade --install datadog datadog/datadog \
            --namespace datadog \
            -f k8s/datadog/values.yaml \
            --set datadog.clusterName="${CLUSTER_NAME}"

      - name: Aplicar manifests
        run: |
          # DD_ENV precisa casar com os valores de env do dashboard/monitores
          # (developer/homolog/production). main->production, develop->homolog.
          case "${{ github.ref_name }}" in
            main)    DD_ENV_TAG="production" ;;
            develop) DD_ENV_TAG="homolog" ;;
            *)       DD_ENV_TAG="developer" ;;
          esac
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          # Valores que dependem da conta, do ambiente e do commit (nada disso fica no
          # repositório). A versão do Datadog é a tag da imagem, para comparar deploys.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DD_VERSION_TAG="${IMAGE##*:}"
          # Canal do e-mail ao cliente: SES só com remetente configurado (o serviço não sobe
          # com ses e sem remetente); sem ele, continua no tópico SNS.
          if [ -n "${SES_SENDER_EMAIL}" ]; then
            NOTIFICATION_ARGS=(--from-literal NOTIFICATION_CHANNEL="ses" --from-literal SES_SENDER_EMAIL="${SES_SENDER_EMAIL}"
              --from-literal SES_CONFIGURATION_SET="workbench-customer-email")
          else
            NOTIFICATION_ARGS=(--from-literal NOTIFICATION_CHANNEL="sns")
          fi
          kubectl create configmap os-service-runtime -n os-service \
            "${NOTIFICATION_ARGS[@]}" \
            --from-literal DD_ENV="${DD_ENV_TAG}" \
            --from-literal DD_VERSION="${DD_VERSION_TAG}" \
            --from-literal MESSAGING_ENABLED="true" \
            --from-literal AWS_REGION="${AWS_REGION}" \
            --from-literal ORDER_EVENTS_TOPIC_ARN="arn:aws:sns:${AWS_REGION}:${ACCOUNT_ID}:workbench-order-events" \
            --from-literal SAGA_REPLIES_QUEUE_URL="https://sqs.${AWS_REGION}.amazonaws.com/${ACCOUNT_ID}/workbench-os-saga-replies-queue" \
            --from-literal NOTIFICATIONS_TOPIC_ARN="arn:aws:sns:${AWS_REGION}:${ACCOUNT_ID}:workbench-os-notifications" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Secret com os valores reais (no lugar do k8s/secret.yaml, que só tem
          # placeholders). Vem depois do ConfigMap no envFrom, então as chaves daqui
          # prevalecem sobre as do ConfigMap.
          kubectl create secret generic os-service-secret -n os-service \
            --from-literal SPRING_DATASOURCE_URL="${DB_URL_OS}" \
            --from-literal SPRING_DATASOURCE_USERNAME="${DB_USERNAME_OS}" \
            --from-literal SPRING_DATASOURCE_PASSWORD="${DB_PASSWORD_OS}" \
            --from-literal JWT_PUBLIC_KEY="${JWT_PUBLIC_KEY}" \
            --from-literal JWT_SERVICE_PRIVATE_KEY="${JWT_SERVICE_PRIVATE_KEY}" \
            --from-literal DD_API_KEY="${DD_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          # O LB do Service passou a ser NLB interno (k8s/app.yaml). O esquema de um LB não
          # muda depois de criado, então um Service antigo (público) é recriado uma vez.
          if kubectl get service os-service -n os-service >/dev/null 2>&1 && \
             [ "$(kubectl get service os-service -n os-service -o jsonpath='{.metadata.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-internal}')" != "true" ]; then
            kubectl delete service os-service -n os-service
          fi
          # A imagem do commit entra no manifesto antes do apply: um rollout só, sem passar
          # pelo placeholder REPLACE_IMAGE.
          sed -e "s#REPLACE_IMAGE#${IMAGE}#" \
              -e "s#tags.datadoghq.com/version: \"1.0.0\"#tags.datadoghq.com/version: \"${DD_VERSION_TAG}\"#" \
              k8s/app.yaml | kubectl apply -f -
          kubectl apply -f k8s/hpa.yaml
          # A tag env das métricas kubernetes.* vem da label tags.datadoghq.com/env
          # do pod (não do DD_ENV do container). Sem ela o widget de CPU/memória
          # (env:$env) fica vazio. Injeta a mesma env mapeada acima.
          kubectl patch deployment os-service -n os-service --type merge \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"tags.datadoghq.com/env\":\"${DD_ENV_TAG}\"}}}}}"
      - name: Aguardar o rollout
        run: |
          kubectl rollout status deployment/os-service -n os-service --timeout=300s

  # ---------------------------------------------------------------------------
  # Datadog config — cria/atualiza o dashboard e os monitores versionados em
  # datadog/ via API (idempotente por título/nome). Independe do cluster: aplica
  # objetos no Datadog SaaS. Roda em develop/main; ignorado sem DD_API_KEY/DD_APP_KEY.
  # ---------------------------------------------------------------------------
  datadog-config:
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
      DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar credenciais Datadog
        id: guard
        run: |
          if [ -z "${DD_API_KEY}" ] || [ -z "${DD_APP_KEY}" ]; then
            echo "::warning::DD_API_KEY/DD_APP_KEY ausentes — pulando aplicação de dashboards/monitores."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Aplicar dashboard e monitores (upsert)
        if: steps.guard.outputs.skip != 'true'
        run: bash .github/scripts/apply-datadog.sh
