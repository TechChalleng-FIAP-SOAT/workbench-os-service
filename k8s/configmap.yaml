apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: os-service
data:
  SERVER_PORT: "8080"
  SPRING_APPLICATION_NAME: os-service
  # Banco próprio do serviço (database-per-service). Ajuste a URL por ambiente.
  SPRING_DATASOURCE_URL: jdbc:postgresql://os-service-db:5432/os_service
  # Valida cliente/veículo e busca o e-mail do cliente no customer-service, pelo DNS
  # interno do cluster (sem passar pelo NLB).
  CUSTOMER_VALIDATION_ENABLED: "true"
  CUSTOMER_SERVICE_URL: "http://customer-service.customer-service.svc.cluster.local:8080"
  DD_ENV: "local"
  DD_SERVICE: "os-service"
  DD_VERSION: "1.0.0"
  DD_METRICS_ENABLED: "true"
  DD_METRICS_URI: "https://api.datadoghq.com"
